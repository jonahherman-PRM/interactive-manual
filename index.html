<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Device Manual</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; background: #f4f4f9; margin: 0; }
        #app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .media-box { width: 100%; height: 250px; background: #ddd; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; white-space: pre-wrap; }
        .button-container { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 5px; background: #007bff; color: white; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .secondary-btn { background: #6c757d; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="step-content">
        <div class="media-box" id="media-container">Media Placeholder</div>
        <h1 id="step-title">Loading...</h1>
        <p id="step-text">Please wait while we load the instructions.</p>
        <div id="button-group" class="button-container"></div>
        <button id="back-btn" class="secondary-btn" style="margin-top: 20px; display: none;">← Back</button>
    </div>
</div>

<script>
    let manualData = [];
    let historyStack = [];

    // Fetch the data with a "Cache Buster" to ensure edits show up instantly
    fetch('./data/manual_data.json?v=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            manualData = data;
            // Only start if we actually have data
            if(manualData.length > 0) {
                renderStep(manualData[0].step_id);
            }
        })
        .catch(err => {
            document.getElementById('step-title').innerText = "Error Loading Data";
            document.getElementById('step-text').innerText = "Check if the repository is Public and the file exists.";
        });

    function renderStep(id) {
        // Find the step (using String comparison to avoid number/text mismatches)
        const step = manualData.find(s => String(s.step_id) === String(id));
        
        if (!step) {
            console.error("Step not found:", id);
            return;
        }

        // Update Text
        document.getElementById('step-title').innerText = step.title || "Instruction Step";
        document.getElementById('step-text').innerText = step.instruction_body || "";

        // Update Media
        const mediaBox = document.getElementById('media-container');
        mediaBox.innerHTML = step.primary_media ? `<img src="${step.primary_media}">` : 'Video Placeholder';

        // Clear and Build Buttons
        const btnGroup = document.getElementById('button-group');
        btnGroup.innerHTML = '';
        
        // Use Grid for multi-choice (3-4 buttons), Column for single/double
        btnGroup.className = step.screen_type === 'multi_choice' ? 'grid-layout' : 'button-container';

        // Loop through all 4 possible buttons
        for (let i = 1; i <= 4; i++) {
            let text = step[`btn${i}_text`];
            let nextId = step[`btn${i}_next_id`];
            
            // Only show the button if BOTH text and a destination ID exist
            if (text && nextId) {
                addButton(text, nextId, id);
            }
        }

        // Handle Back Button Visibility
        const backBtn = document.getElementById('back-btn');
        backBtn.style.display = historyStack.length > 0 ? 'block' : 'none';
        backBtn.onclick = () => {
            const lastId = historyStack.pop();
            renderStep(lastId);
        };
    }

    function addButton(text, nextId, currentId) {
        const btn = document.createElement('button');
        btn.innerText = text;
        btn.onclick = () => {
            historyStack.push(currentId); // Save where we are before moving
            renderStep(nextId);
        };
        document.getElementById('button-group').appendChild(btn);
    }
</script>

</body>
</html>
