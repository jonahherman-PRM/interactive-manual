<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Device Manual</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G20116GB0M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-G20116GB0M');
    </script>

    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; background: #f4f4f9; margin: 0; padding: 10px; }
        #app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); box-sizing: border-box; border-radius: 8px; }
        .media-box { width: 100%; height: 250px; background: #ddd; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.2rem; margin-bottom: 10px; color: #333; padding-right: 80px; }
        p { color: #555; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }
        
        #step-content { position: relative; }
        
        #home-btn {
            position: absolute;
            top: 0;
            right: 0;
            padding: 8px 12px;
            font-size: 0.85rem;
            min-height: 40px;
            width: auto;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            z-index: 10;
            cursor: pointer;
        }

        .button-container { display: flex; flex-direction: column; gap: 12px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        button { 
            padding: 15px; border: none; border-radius: 8px; background: #007bff; color: white; 
            font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center; 
            min-height: 80px; width: 100%; font-weight: 500;
        }
        
        button:hover { background: #0056b3; }
        button:active { transform: scale(0.98); }
        button img { width: 32px; height: 32px; margin-bottom: 8px; object-fit: contain; }
        .secondary-btn { background: #6c757d; width: 100%; margin-top: 20px; min-height: 50px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="step-content">
        <button id="home-btn" style="display: none;">Home</button>
        <div class="media-box" id="media-container">Media Placeholder</div>
        <h1 id="step-title">Loading...</h1>
        <p id="step-text">Please wait while we load the instructions.</p>
        <div id="button-group"></div>
        <button id="back-btn" class="secondary-btn" style="display: none;">← Back</button>
    </div>
</div>

<script>
    let manualData = [];
    let historyStack = [];
    let stepStartTime = Date.now();
    let sessionStartTime = Date.now();

    fetch('./data/manual_data.json?v=' + new Date().getTime())
        .then(response => response.json())
        .then(data => {
            manualData = data;
            if(manualData.length > 0) renderStep(manualData[0].step_id);
        })
        .catch(err => {
            document.getElementById('step-title').innerText = "Data Not Found";
            console.error(err);
        });

    function renderStep(id) {
        const step = manualData.find(s => String(s.step_id) === String(id));
        if (!step) return;

        stepStartTime = Date.now();
        document.getElementById('step-title').innerText = step.title || "Step";
        document.getElementById('step-text').innerText = step.instruction_body || "";
        
        const mediaBox = document.getElementById('media-container');
        mediaBox.innerHTML = step.primary_media ? `<img src="${step.primary_media}">` : 'Visual Placeholder';

        const btnGroup = document.getElementById('button-group');
        btnGroup.innerHTML = '';
        btnGroup.className = (step.screen_type === 'multi_choice') ? 'grid-layout' : 'button-container';

        // Home Button Toggle
        const homeBtn = document.getElementById('home-btn');
        homeBtn.style.display = (id === manualData[0].step_id) ? 'none' : 'block';
        homeBtn.onclick = () => {
            historyStack = []; 
            renderStep(manualData[0].step_id);
        };

        if (step.title.includes("Complete")) {
            gtag('event', 'manual_completion', {
                'total_time': Math.round((Date.now() - sessionStartTime) / 1000)
            });
        }

        for (let i = 1; i <= 8; i++) {
            let bText = step[`btn${i}_text`];
            let bNext = step[`btn${i}_next_id`];
            let bIcon = step[`btn${i}_image`];
            if (bText && bNext) addButton(bText, bNext, id, bIcon);
        }

        const backBtn = document.getElementById('back-btn');
        backBtn.style.display = historyStack.length > 0 ? 'block' : 'none';
        backBtn.onclick = () => renderStep(historyStack.pop());
    }

    function addButton(text, nextId, currentId, iconPath) {
        const btn = document.createElement('button');
        if (iconPath) {
            const img = document.createElement('img');
            img.src = iconPath;
            btn.appendChild(img);
        }
        const span = document.createElement('span');
        span.innerText = text;
        btn.appendChild(span);

        btn.onclick = () => {
            const currentTitle = document.getElementById('step-title').innerText;
            const nextStepObj = manualData.find(s => String(s.step_id) === String(nextId));
            const nextTitle = nextStepObj ? nextStepObj.title : "Unknown Step";

            gtag('event', 'manual_navigation', {
                'from_step_title': currentTitle,
                'to_step_title': nextTitle,
                'button_label': text,
                'seconds_spent': Math.round((Date.now() - stepStartTime) / 1000)
            });

            historyStack.push(currentId);
            renderStep(nextId);
        };
        document.getElementById('button-group').appendChild(btn);
    }
</script>

</body>
</html>
